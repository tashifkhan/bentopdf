    <style>
      /* ── Multi Tool chrome ───────────────────────────────────── */
      .mt-shell {
        --mt-bg: #0f1412;
        --mt-surface: #171d1a;
        --mt-surface-2: #1e2622;
        --mt-surface-3: #2a342f;
        --mt-ink: #f0ede6;
        --mt-ink-2: #b8c0bb;
        --mt-ink-3: #7f8a84;
        --mt-line: #2c3732;
        --mt-brand: #7dcfb6;
        --mt-brand-hover: #9bdbc8;
        --mt-brand-ink: #0d110f;
        --mt-danger: #e85d4c;
        --mt-danger-hover: #f07060;
        --mt-danger-soft: rgba(232, 93, 76, 0.14);
        --mt-radius: 12px;
        --mt-ctrl-h: 40px;
        --mt-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        background: var(--mt-bg);
        color: var(--mt-ink);
      }

      html[data-theme='light'] .mt-shell {
        --mt-bg: #f2f0eb;
        --mt-surface: #fffcf8;
        --mt-surface-2: #f6f3ed;
        --mt-surface-3: #ebe7df;
        --mt-ink: #151b18;
        --mt-ink-2: #3f4843;
        --mt-ink-3: #6a746e;
        --mt-line: #e0dbd1;
        --mt-brand: #1a3d35;
        --mt-brand-hover: #255249;
        --mt-brand-ink: #f7f4ee;
        --mt-danger: #c93b2c;
        --mt-danger-hover: #a83024;
        --mt-danger-soft: rgba(201, 59, 44, 0.1);
        --mt-shadow: 0 8px 24px rgba(21, 27, 24, 0.08);
      }

      .mt-shell .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .mt-shell .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .mt-appbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        height: 56px;
        padding: 0 0.85rem;
        padding-top: env(safe-area-inset-top, 0);
        border-bottom: 1px solid var(--mt-line);
        background: color-mix(in srgb, var(--mt-surface) 92%, transparent);
        backdrop-filter: blur(12px);
        flex: none;
        z-index: 30;
      }

      .mt-brand {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        min-width: 0;
        color: var(--mt-ink);
        text-decoration: none;
      }

      .mt-brand img {
        width: 28px;
        height: 28px;
        border-radius: 8px;
      }

      .mt-brand-text {
        display: flex;
        flex-direction: column;
        line-height: 1.15;
        min-width: 0;
      }

      .mt-brand-text strong {
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .mt-brand-text small {
        color: var(--mt-ink-3);
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .mt-appbar-actions {
        display: flex;
        align-items: center;
        gap: 0.45rem;
      }

      .mt-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        min-height: var(--mt-ctrl-h);
        min-width: var(--mt-ctrl-h);
        padding: 0 0.75rem;
        border: 1px solid transparent;
        border-radius: 10px;
        background: var(--mt-surface-2);
        color: var(--mt-ink-2);
        font-size: 0.8rem;
        font-weight: 600;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
        transition:
          background 140ms ease,
          border-color 140ms ease,
          color 140ms ease,
          transform 140ms ease;
      }

      .mt-btn:hover {
        background: var(--mt-surface-3);
        color: var(--mt-ink);
      }

      .mt-btn:active {
        transform: scale(0.98);
      }

      .mt-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }

      .mt-btn svg {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
      }

      .mt-btn-ghost {
        background: transparent;
        border-color: var(--mt-line);
        color: var(--mt-ink-2);
      }

      .mt-btn-ghost:hover {
        background: var(--mt-surface-2);
        color: var(--mt-ink);
      }

      .mt-btn-primary {
        background: var(--mt-brand);
        color: var(--mt-brand-ink);
        border-color: transparent;
        font-weight: 700;
      }

      .mt-btn-primary:hover {
        background: var(--mt-brand-hover);
        color: var(--mt-brand-ink);
      }

      .mt-btn-primary svg {
        stroke: currentColor;
      }

      .mt-btn-danger {
        background: var(--mt-danger-soft);
        color: var(--mt-danger);
        border-color: color-mix(in srgb, var(--mt-danger) 28%, transparent);
      }

      .mt-btn-danger:hover {
        background: var(--mt-danger);
        color: #fff;
      }

      .mt-btn-icon {
        padding: 0;
        width: var(--mt-ctrl-h);
      }

      .mt-toolbar {
        flex: none;
        z-index: 20;
        border-bottom: 1px solid var(--mt-line);
        background: var(--mt-surface);
        -webkit-user-select: none;
        user-select: none;
      }

      .mt-toolbar-inner {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.55rem 0.65rem;
        min-height: 56px;
      }

      .mt-toolbar-scroll {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        flex: 1;
        min-width: 0;
        overflow-x: auto;
        padding-bottom: 1px;
      }

      .mt-group {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        padding: 3px;
        border: 1px solid var(--mt-line);
        border-radius: 12px;
        background: var(--mt-surface-2);
        flex: 0 0 auto;
      }

      .mt-group .mt-btn {
        background: transparent;
        border-radius: 9px;
        min-height: 36px;
        min-width: 36px;
        padding: 0 0.65rem;
        color: var(--mt-ink-2);
      }

      .mt-group .mt-btn:hover {
        background: var(--mt-surface-3);
        color: var(--mt-ink);
      }

      .mt-group .mt-btn-primary {
        background: var(--mt-brand);
        color: var(--mt-brand-ink);
      }

      .mt-group .mt-btn-primary:hover {
        background: var(--mt-brand-hover);
        color: var(--mt-brand-ink);
      }

      .mt-group .mt-btn-danger {
        background: transparent;
        color: var(--mt-danger);
      }

      .mt-group .mt-btn-danger:hover {
        background: var(--mt-danger);
        color: #fff;
      }

      .mt-sep {
        width: 1px;
        height: 22px;
        background: var(--mt-line);
        flex: 0 0 auto;
        margin: 0 0.15rem;
      }

      .mt-toolbar-end {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex: 0 0 auto;
        margin-left: auto;
        padding-left: 0.35rem;
      }

      .mt-label-sm {
        display: none;
      }

      @media (min-width: 900px) {
        .mt-label-sm {
          display: inline;
        }
      }

      /* Canvas / empty */
      .mt-canvas {
        flex: 1;
        overflow: auto;
        padding: 1rem;
        padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
        background:
          radial-gradient(
            ellipse 60% 40% at 50% 0%,
            color-mix(in srgb, var(--mt-brand) 8%, transparent),
            transparent
          ),
          var(--mt-bg);
      }

      .mt-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: min(420px, 60dvh);
        margin: 0 auto;
        max-width: 28rem;
        padding: 2rem 1.25rem;
        border: 1.5px dashed var(--mt-line);
        border-radius: 20px;
        background: color-mix(in srgb, var(--mt-surface) 80%, transparent);
        text-align: center;
        cursor: pointer;
        transition:
          border-color 160ms ease,
          background 160ms ease;
      }

      .mt-empty:hover {
        border-color: color-mix(in srgb, var(--mt-brand) 45%, var(--mt-line));
        background: color-mix(in srgb, var(--mt-brand) 5%, var(--mt-surface));
      }

      .mt-empty-icon {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin-bottom: 1rem;
        border-radius: 18px;
        background: color-mix(in srgb, var(--mt-brand) 12%, transparent);
        color: var(--mt-brand);
      }

      .mt-empty-icon svg {
        width: 28px;
        height: 28px;
      }

      .mt-empty h2 {
        margin: 0;
        color: var(--mt-ink);
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .mt-empty p {
        margin: 0.45rem 0 1.15rem;
        color: var(--mt-ink-3);
        font-size: 0.88rem;
        line-height: 1.5;
      }

      /* Tailwind .hidden loses to .mt-empty { display:flex } — force hide when both apply */
      .mt-empty.hidden {
        display: none !important;
      }

      /*
        File inputs must NOT use display:none — Safari/Chrome often block
        programmatic .click() on display:none inputs. Keep them in the a11y tree.
      */
      .mt-file-input {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
        opacity: 0;
        pointer-events: none;
      }

      #pages-container {
        gap: 0.85rem;
      }

      /* Mobile bottom dock */
      .mt-dock {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 35;
        padding: 0.55rem 0.75rem
          calc(0.55rem + env(safe-area-inset-bottom, 0px));
        border-top: 1px solid var(--mt-line);
        background: color-mix(in srgb, var(--mt-surface) 94%, transparent);
        backdrop-filter: blur(14px);
        box-shadow: var(--mt-shadow);
      }

      .mt-dock-inner {
        display: grid;
        grid-template-columns: 1fr 1fr 1.2fr;
        gap: 0.45rem;
        max-width: 520px;
        margin: 0 auto;
      }

      .mt-dock .mt-btn {
        width: 100%;
        min-height: 44px;
      }

      @media (max-width: 768px) {
        .mt-toolbar-end {
          display: none;
        }

        .mt-dock {
          display: block;
        }

        .mt-canvas {
          padding-bottom: calc(5.25rem + env(safe-area-inset-bottom, 0px));
        }

        .mt-btn span.mt-hide-xs {
          display: none;
        }

        .mt-group .mt-btn {
          padding: 0 0.55rem;
        }
      }

      body.dragging {
        overflow: hidden;
      }

      /* Modal / loader aligned to shell */
      .mt-shell #loading-overlay > div,
      .mt-shell #modal > div {
        border: 1px solid var(--mt-line);
        border-radius: 16px;
        background: var(--mt-surface);
        color: var(--mt-ink);
        box-shadow: var(--mt-shadow);
      }

      .mt-shell #loading-text,
      .mt-shell #modal-title {
        color: var(--mt-ink);
      }

      .mt-shell #modal-message {
        color: var(--mt-ink-2);
      }

      .mt-shell #loading-progress {
        background: var(--mt-brand);
      }

      .mt-shell #modal-close-btn {
        background: var(--mt-brand);
        color: var(--mt-brand-ink);
        border-radius: 10px;
        min-height: 44px;
        font-weight: 700;
      }
    </style>

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link

      type="image/png"
      sizes="192x192"
      href="/images/favicon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"

    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/apple-touch-icon.png"
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
  </head>

  <body
    class="mt-shell antialiased h-[100dvh] overflow-hidden flex flex-col"
  >
    <!-- App bar -->
    <header class="mt-appbar">
      <a class="mt-brand" href="{{baseUrl}}" aria-label="Back to all PDF tools">
        <img
          src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/taf-pdf-mark.svg{{/if}}"
          alt="{{#if brandName}}{{brandName}}{{else}}Bento PDF{{/if}} Logo"
          width="28"
          height="28"
        />
        <span class="mt-brand-text">
          <strong id="nav-brand"
            >{{#if brandName}}{{brandName}}{{else}}BentoPDF{{/if}}</strong
          >
          <small>PDF Multi Tool</small>
        </span>
      </a>
      <div class="mt-appbar-actions">
        <button
          id="close-tool-btn"
          type="button"
          class="mt-btn mt-btn-ghost"
          aria-label="Close Multi Tool"
        >
          <i data-lucide="x"></i>
          <span class="mt-label-sm" data-i18n="common.close">Close</span>
        </button>
      </div>
    </header>

    <h1 class="sr-only">PDF Multi Tool Free Online - Edit & Organize PDFs</h1>

    <div class="flex flex-col flex-1 overflow-hidden relative">
      <!-- Toolbar: scrollable tools + pinned primary actions -->
      <div class="mt-toolbar toolbar-container">
        <div class="mt-toolbar-inner">
          <div class="mt-toolbar-scroll scrollbar-hide">
            <!-- Files -->
            <div class="mt-group" role="group" aria-label="Files">
              <button
                id="upload-pdfs-btn"
                type="button"
                class="mt-btn mt-btn-primary"
                title="Upload PDFs"
              >
                <i data-lucide="upload"></i>
                <span data-i18n="multiTool.upload">Upload</span>
              </button>
              <button
                id="add-blank-page-btn"
                type="button"
                class="mt-btn"
                title="Add blank page"
              >
                <i data-lucide="file-plus"></i>
                <span class="mt-label-sm" data-i18n="multiTool.addBlankPage"
                  >Blank</span
                >
              </button>
            </div>

            <div class="mt-sep" aria-hidden="true"></div>

            <!-- History -->
            <div class="mt-group" role="group" aria-label="History">
              <button
                id="undo-btn"
                type="button"
                class="mt-btn mt-btn-icon"
                title="Undo"
                aria-label="Undo"
              >
                <i data-lucide="undo-2"></i>
              </button>
              <button
                id="redo-btn"
                type="button"
                class="mt-btn mt-btn-icon"
                title="Redo"
                aria-label="Redo"
              >
                <i data-lucide="redo-2"></i>
              </button>
              <button
                id="reset-btn"
                type="button"
                class="mt-btn mt-btn-icon"
                title="Reset"
                aria-label="Reset"
              >
                <i data-lucide="refresh-ccw"></i>
              </button>
            </div>

            <!-- Selection -->
            <div class="mt-group" role="group" aria-label="Selection">
              <button
                id="select-all-btn"
                type="button"
                class="mt-btn"
                title="Select all"
              >
                <i data-lucide="check-square"></i>
                <span class="mt-label-sm" data-i18n="multiTool.selectAll"
                  >All</span
                >
              </button>
              <button
                id="deselect-all-btn"
                type="button"
                class="mt-btn"
                title="Deselect all"
              >
                <i data-lucide="square"></i>
                <span class="mt-label-sm" data-i18n="multiTool.deselectAll"
                  >None</span
                >
              </button>
            </div>

            <!-- Transform -->
            <div class="mt-group" role="group" aria-label="Transform">
              <button
                id="bulk-rotate-left-btn"
                type="button"
                class="mt-btn mt-btn-icon"
                title="Rotate left"
                aria-label="Rotate left"
              >
                <i data-lucide="rotate-ccw"></i>
              </button>
              <button
                id="bulk-rotate-btn"
                type="button"
                class="mt-btn mt-btn-icon"
                title="Rotate right"
                aria-label="Rotate right"
              >
                <i data-lucide="rotate-cw"></i>
              </button>
              <button
                id="bulk-duplicate-btn"
                type="button"
                class="mt-btn mt-btn-icon"
                title="Duplicate"
                aria-label="Duplicate"
              >
                <i data-lucide="copy"></i>
              </button>
              <button
                id="bulk-split-btn"
                type="button"
                class="mt-btn mt-btn-icon"
                title="Split"
                aria-label="Split"
              >
                <i data-lucide="scissors"></i>
              </button>
            </div>
          </div>

          <!-- Desktop / tablet primary actions (pinned) -->
          <div class="mt-toolbar-end">
            <button
              id="bulk-delete-btn"
              type="button"
              class="mt-btn mt-btn-danger"
              title="Delete selected"
            >
              <i data-lucide="trash-2"></i>
              <span class="mt-label-sm" data-i18n="multiTool.delete"
                >Delete</span
              >
            </button>
            <button
              id="bulk-download-btn"
              type="button"
              class="mt-btn mt-btn-ghost"
              title="Download selected pages"
            >
              <i data-lucide="download"></i>
              <span class="mt-label-sm" data-i18n="multiTool.downloadSelected"
                >Selected</span
              >
            </button>
            <button
              id="export-pdf-btn"
              type="button"
              class="mt-btn mt-btn-primary"
              title="Export PDF"
            >
              <i data-lucide="file-output"></i>
              <span data-i18n="multiTool.exportPdf">Export</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Canvas -->
      <div id="main-scroll-container" class="mt-canvas">
        <div id="upload-area" class="mt-empty">
          <div class="mt-empty-icon" aria-hidden="true">
            <i data-lucide="upload-cloud"></i>
          </div>
          <h2 data-i18n="multiTool.uploadPdfFiles">
            Select PDF or image files
          </h2>
          <p data-i18n="multiTool.dragAndDrop">
            Drag and drop files here, or choose files to start organizing pages.
          </p>
          <!-- Native label association opens the picker without JS -->
          <input
            type="file"
            id="pdf-file-input"
            accept="application/pdf,image/*,.heic,.heif,.jpg,.jpeg,.png,.bmp,.gif,.tiff,.tif,.webp,.svg,.psd,.jp2,.jpx,.jxr,.pnm,.pgm,.pbm,.ppm,.pam"
            multiple
            class="mt-file-input"
          />
          <label
            id="pdf-file-input-select-btn"
            for="pdf-file-input"
            class="mt-btn mt-btn-primary"
            data-i18n="multiTool.selectFiles"
            role="button"
            tabindex="0"
          >
            Select Files
          </label>
        </div>

        <div
          id="pages-container"
          class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4"
        ></div>
      </div>
    </div>

    <!-- Mobile dock: primary actions in the thumb zone -->
    <div class="mt-dock" aria-label="Primary actions">
      <div class="mt-dock-inner">
        <button
          type="button"
          class="mt-btn mt-btn-ghost"
          data-mt-proxy="upload-pdfs-btn"
        >
          <i data-lucide="upload"></i>
          <span data-i18n="multiTool.upload">Upload</span>
        </button>
        <button
          type="button"
          class="mt-btn mt-btn-danger"
          data-mt-proxy="bulk-delete-btn"
        >
          <i data-lucide="trash-2"></i>
          <span data-i18n="multiTool.delete">Delete</span>
        </button>
        <button
          type="button"
          class="mt-btn mt-btn-primary"
          data-mt-proxy="export-pdf-btn"
        >
          <i data-lucide="file-output"></i>
          <span data-i18n="multiTool.exportPdf">Export</span>
        </button>
      </div>
    </div>

    <!-- Loading Overlay -->
    <div
      id="loading-overlay"
