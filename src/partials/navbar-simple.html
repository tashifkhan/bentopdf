{{> theme-boot }}
<nav class="workspace-nav" data-simple-nav="true" aria-label="Primary">
  <div class="workspace-nav-inner">
    <a
      class="workspace-brand"
      href="{{baseUrl}}"
      aria-label="Back to all PDF tools"
    >
      <span class="workspace-brand-mark">
        <img
          id="nav-logo"
          src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/taf-pdf-mark.svg{{/if}}"
          alt="{{#if brandName}}{{brandName}}{{else}}Bento PDF{{/if}} Logo"
          width="28"
          height="28"
        />
      </span>
      <span class="workspace-brand-copy">
        <strong id="nav-brand"
          >{{#if brandName}}{{brandName}}{{else}}BentoPDF{{/if}}</strong
        >
        <small>Private document tools</small>
      </span>
    </a>

    <div class="workspace-nav-actions">
      <span
        class="workspace-local-status"
        title="Processing stays in your browser"
      >
        <span class="workspace-status-dot" aria-hidden="true"></span>
        On this device
      </span>
      <a
        class="workspace-source-link"
        href="https://github.com/tashifkhan/bentopdf"
        target="_blank"
        rel="noopener noreferrer"
      >
        Source
      </a>
      <button
        id="theme-toggle"
        class="workspace-theme-toggle"
        type="button"
        aria-label="Toggle color theme"
      >
        <i data-lucide="sun" class="theme-icon-light"></i>
        <i data-lucide="moon" class="theme-icon-dark"></i>
      </button>
    </div>
  </div>
</nav>
