services:
  bentopdf-dev:
    image: oven/bun:1.3.9
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev -- --host 0.0.0.0 --port 3000"
    volumes:
      - ./web:/app
      - web_bun_modules:/app/node_modules
    ports:
      - '3000:3000'
    environment:
      - HOST=0.0.0.0
      - PORT=3000

volumes:
  web_bun_modules:
