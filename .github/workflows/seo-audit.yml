name: SEO audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
      VITE_SITE_URL: https://pdf.taf.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install dependencies
        run: npm ci
      - name: Install site dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build
        run: npm run build
      - name: SEO audit
        run: npm run seo-audit
