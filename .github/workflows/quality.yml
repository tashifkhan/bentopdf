name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install site dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build the deployed TanStack site and typecheck
        env:
          VITE_SITE_URL: https://pdf.taf.sh
        run: npm run build
